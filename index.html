<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#111111; --card:#171717; --fg:#cccccc; --hi:#ffffff; --mute:#7d7d7d; --hair:rgba(204,204,204,.12); --line:rgba(204,204,204,.3); --orange:#FC4C02; }
  :root[data-theme="light"] { --bg:#f3f3f1; --card:#ffffff; --fg:#161616; --hi:#000000; --mute:#77756f; --hair:rgba(0,0,0,.1); --line:rgba(0,0,0,.28); }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 Geist, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 40px 80px; }
  @media (max-width:720px) { .wrap { padding:0 16px 56px; } }
  a { color:inherit; text-decoration:underline; text-decoration-color:var(--orange); text-decoration-thickness:1px; text-underline-offset:4px; }
  a:hover { color:var(--hi); }
  .mono, td, .v { font-variant-numeric:tabular-nums; }
  .mute { color:var(--mute); }

  nav { display:flex; align-items:center; gap:28px; padding:34px 0 30px; border-bottom:1px solid var(--hair); }
  nav .mark { font-size:24px; font-weight:600; letter-spacing:-.025em; margin-right:auto; }
  nav .route { font-size:13px; font-weight:500; opacity:.7; white-space:nowrap; }
  #theme { width:36px; height:36px; border-radius:50%; border:1px solid var(--fg); background:linear-gradient(90deg, var(--fg) 50%, transparent 50%); cursor:pointer; padding:0; flex:none; }
  #theme:focus-visible { outline:1px solid var(--orange); outline-offset:3px; }

  .hero { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:32px; align-items:end; padding:88px 0 72px; }
  h1 { font-size:clamp(44px, 8.6vw, 96px); font-weight:600; letter-spacing:-.05em; line-height:.95; margin:0 0 28px; text-wrap:balance; max-width:11ch; }
  .sub { font-size:18px; line-height:1.5; font-weight:500; margin:0; max-width:34ch; }
  .sub .mute { display:block; }
  canvas.art { display:block; max-width:100%; height:auto; }
  @media (max-width:860px) { .hero { grid-template-columns:1fr; padding:56px 0 48px; } .hero canvas.field { display:none; } }

  .chip { display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line); border-radius:999px; padding:6px 16px; white-space:nowrap; }
  .chip .n { color:var(--orange); }
  .chip.solid { background:var(--fg); color:var(--bg); border-color:var(--fg); }

  .tiles { display:grid; grid-template-columns:repeat(4, 1fr); gap:26px; }
  .tile { background:var(--card); padding:26px 26px 24px; min-width:0; }
  .tile .k { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  .tile .v { font-size:clamp(30px, 3.4vw, 44px); font-weight:600; letter-spacing:-.045em; line-height:1.05; margin-top:26px; color:var(--hi); overflow-wrap:anywhere; }
  .tile .d { font-size:13px; font-weight:500; color:var(--mute); margin-top:8px; }
  .tile.hot { box-shadow:inset 0 1px 0 var(--orange); }
  .tile.hot .v { color:var(--orange); }
  @media (max-width:980px) { .tiles { grid-template-columns:repeat(2, 1fr); gap:16px; } }
  @media (max-width:480px) { .tiles { grid-template-columns:1fr; } }

  section { margin-top:26px; background:var(--card); padding:26px 26px 14px; }
  @media (max-width:720px) { section, .tile { padding-left:18px; padding-right:18px; } }
  .label { display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px; padding-bottom:14px; }
  .label .note { margin-left:auto; font-size:13px; font-weight:500; color:var(--mute); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-family:"Geist Mono", Consolas, monospace; font-size:13px; }
  th { text-align:left; font:700 10px Geist, sans-serif; letter-spacing:.11em; text-transform:uppercase; color:var(--mute); padding:12px 18px 12px 0; border-bottom:1px solid var(--hair); white-space:nowrap; }
  td { padding:13px 18px 13px 0; border-bottom:1px solid var(--hair); white-space:nowrap; }
  tbody tr:last-child td { border-bottom:0; }
  td.price { color:var(--hi); font-weight:500; }
  tr.target td:first-child { box-shadow:inset 1px 0 0 var(--orange); padding-left:14px; }
  .tag { display:inline-block; font:700 10px Geist, sans-serif; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--mute); }
  .tag.on { color:var(--orange); border-color:var(--orange); }
  .empty { padding:10px 0 20px; color:var(--mute); font-weight:500; max-width:70ch; }

  .bars { display:grid; grid-template-columns:repeat(24, 1fr); gap:4px; align-items:end; height:132px; padding-top:8px; }
  .bars .col { display:flex; flex-direction:column-reverse; gap:3px; height:100%; align-items:center; }
  .bars .b { width:100%; max-width:22px; aspect-ratio:1; max-height:9px; background:var(--fg); }
  .bars .col.peak .b { background:var(--orange); }
  .axis { display:grid; grid-template-columns:repeat(24, 1fr); gap:4px; font:500 10px "Geist Mono", monospace; color:var(--mute); text-align:center; border-top:1px solid var(--hair); padding:8px 0 14px; margin-top:8px; }
  .spark { display:inline-flex; align-items:flex-end; gap:2px; height:14px; vertical-align:middle; margin-left:10px; }
  .spark i { width:3px; background:var(--mute); display:block; }
  .spark i:last-child { background:var(--orange); }
  footer { margin-top:56px; padding-top:22px; border-top:1px solid var(--hair); font-size:13px; font-weight:500; color:var(--mute); max-width:100ch; line-height:1.6; }
</style>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="mark">Snap Watch</span>
    <span class="route" id="route"></span>
    <button id="theme" type="button" aria-label="Changer de thème clair / sombre"></button>
  </nav>

  <div class="hero">
    <div>
      <canvas class="art" id="train" aria-hidden="true" style="margin-bottom:34px"></canvas>
      <h1 id="headline">Chargement…</h1>
      <p class="sub" id="sub"></p>
    </div>
    <canvas class="art field" id="field" aria-hidden="true"></canvas>
  </div>

  <div class="tiles" id="tiles"></div>

  <section>
    <div class="label"><span class="chip"><span class="n">001</span>En vente maintenant</span><span class="note">prix par personne</span></div>
    <div class="scroll" id="live"></div>
  </section>

  <section>
    <div class="label"><span class="chip"><span class="n">002</span>Sorties de billets</span><span class="note">date et heure où chaque créneau est apparu</span></div>
    <div class="scroll" id="releases"></div>
  </section>

  <section>
    <div class="label"><span class="chip"><span class="n">003</span>Partis</span><span class="note">quand, et après combien de temps en vente</span></div>
    <div class="scroll" id="gone"></div>
  </section>

  <section>
    <div class="label"><span class="chip"><span class="n">004</span>Heure de sortie</span><span class="note">créneaux sortis par heure (Paris)</span></div>
    <div id="hours"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const TRAIN = [
  '..........######################',
  '.......#########################',
  '.....####..##..##..##..##..##.##',
  '...######..##..##..##..##..##.##',
  '..##############################',
  '.###############################',
  'oooooooooooooooooooooooooooooooo',
  '################################',
  '...###.......###.......###......',
  '....#.........#.........#.......',
];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function drawArt() {
  // Pixel train.
  const c = document.getElementById('train'), s = 6;
  c.width = TRAIN[0].length * s; c.height = TRAIN.length * s;
  let g = c.getContext('2d');
  TRAIN.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    g.fillStyle = ch === 'o' ? css('--orange') : css('--fg');
    g.fillRect(x * s, y * s, s, s);
  }));
  // Pixel field: a grid of squares that shrink away from the "rails", crossed by one thin orange line.
  const f = document.getElementById('field'), cols = 26, rows = 18, pitch = 15, dpr = Math.min(2, window.devicePixelRatio || 1);
  f.width = cols * pitch * dpr; f.height = rows * pitch * dpr; f.style.width = cols * pitch + 'px';
  g = f.getContext('2d'); g.scale(dpr, dpr); g.fillStyle = css('--fg');
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const d = Math.hypot((x - cols * .78) / cols, (y - rows * .3) / rows);
    const size = Math.max(1, Math.round((1 - Math.min(1, d * 1.5)) * (pitch - 4)));
    g.fillRect(x * pitch + (pitch - size) / 2, y * pitch + (pitch - size) / 2, size, size);
  }
  g.fillStyle = css('--orange');
  g.fillRect(0, Math.round(rows * .62) * pitch - .5, cols * pitch, 1);
}
drawArt();
document.getElementById('theme').addEventListener('click', () => {
  const next = (document.documentElement.dataset.theme || 'dark') === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) {}
  drawArt();
});

const P = { timeZone: 'Europe/Paris' };
const f = (o) => new Intl.DateTimeFormat('fr-FR', { ...P, ...o });
const day = (d) => f({ weekday: 'short', day: '2-digit', month: 'short', timeZone: 'UTC' }).format(new Date(d + 'T12:00:00Z')).replace(/\./g, '');
const longDay = (d) => f({ weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).format(new Date(d + 'T12:00:00Z'));
const stamp = (iso) => f({ weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)).replace(/\./g, '').replace(',', '');
const hm = (iso) => f({ hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
const PERIOD = { morning: 'matin', afternoon: 'après-midi' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const last = (o) => o.prices[o.prices.length - 1].price;
const money = (o, p = last(o)) => (p == null ? '—' : p + ' ' + (o.cur || '€'));
function dur(ms) {
  const min = Math.round(ms / 60000);
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60);
  if (h < 24) return h + ' h ' + String(min % 60).padStart(2, '0');
  return Math.floor(h / 24) + ' j ' + (h % 24) + ' h';
}
const ago = (iso) => dur(Math.max(0, Date.now() - new Date(iso)));
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const table = (head, rows) => '<table><thead><tr>' + head.map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
const empty = (t) => '<div class="empty">' + t + '</div>';
const url = (d, o) => 'https://snap.eurostar.com/fr-fr/search?adult=' + d.adults + '&origin=' + d.route.origin + '&destination=' + d.route.destination + '&outbound=' + o.date + '&outslot=' + encodeURIComponent(o.time);
const spark = (o) => {
  if (o.prices.length < 2) return '';
  const v = o.prices.map((p) => p.price), lo = Math.min(...v), hi = Math.max(...v);
  return '<span class="spark" title="' + v.join(' → ') + '">' + v.map((p) => '<i style="height:' + (4 + (hi === lo ? 0 : ((p - lo) / (hi - lo)) * 10)) + 'px"></i>').join('') + '</span>';
};
// Days between the release and the travel date.
const lead = (o) => (new Date(o.date + 'T06:00:00+01:00') - new Date(o.releasedAt)) / 86400000;

function render(d) {
  const open = d.offers.filter((o) => !o.closedAt).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const tracked = d.offers.filter((o) => o.releasedAt);
  const gone = d.offers.filter((o) => o.closedAt && o.closedReason !== 'expired').sort((a, b) => b.closedAt.localeCompare(a.closedAt));
  const sold = gone.filter((o) => o.closedReason === 'sold_out');
  const t = d.target, isT = (o) => t && o.date === t.date && o.period === t.slot;
  const hit = open.find(isT);

  document.getElementById('route').textContent = d.route.label;
  document.title = 'Snap Watch · ' + d.route.label;
  const dates = new Set(open.map((o) => o.date)).size;
  document.getElementById('headline').textContent = open.length ? open.length + ' créneau' + (open.length > 1 ? 'x' : '') + ' en vente' : 'Rien en vente';
  const s = d.status;
  document.getElementById('sub').innerHTML = 'Eurostar Snap, ' + esc(d.route.label) + ', ' + d.adults + ' adulte(s), sur ' + dates + ' date' + (dates > 1 ? 's' : '') + '.<span class="mute">Dernier scan ' + (s.lastOkAt ? 'il y a ' + ago(s.lastOkAt) + ' (' + stamp(s.lastOkAt) + ')' : 'jamais réussi') + (s.errors ? ' · ' + s.errors + ' échec(s) depuis' : '') + '.</span>';

  const leads = tracked.map(lead), soldDur = sold.filter((o) => o.releasedAt).map((o) => new Date(o.closedAt) - new Date(o.releasedAt));
  const mLead = median(leads), mSold = median(soldDur), cheapest = open.length ? open.reduce((a, b) => (last(a) <= last(b) ? a : b)) : null;
  const tiles = [
    t ? { hot: !!hit, k: 'Votre départ', v: hit ? money(hit) : 'Pas encore', d: longDay(t.date) + ' ' + PERIOD[t.slot] } : null,
    { k: 'Moins cher en vente', v: cheapest ? money(cheapest) : '—', d: cheapest ? day(cheapest.date) + ' ' + PERIOD[cheapest.period] : 'rien en vente' },
    { k: 'Sortie avant départ', v: mLead == null ? '—' : mLead.toFixed(1).replace('.', ',') + ' j', d: mLead == null ? 'pas encore de sortie observée' : 'médiane sur ' + leads.length + ' sortie(s)' },
    { k: 'Temps pour se vendre', v: mSold == null ? '—' : dur(mSold), d: mSold == null ? 'pas encore de vente observée' : 'médiane sur ' + soldDur.length + ' créneau(x)' },
  ].filter(Boolean);
  document.getElementById('tiles').innerHTML = tiles.map((x) => '<div class="tile' + (x.hot ? ' hot' : '') + '"><div class="k">' + x.k + '</div><div class="v">' + esc(x.v) + '</div><div class="d">' + esc(x.d) + '</div></div>').join('');

  document.getElementById('live').innerHTML = open.length ? table(['Date', 'Créneau', 'Départ entre', 'Prix', 'Sorti le', 'En vente depuis', ''], open.map((o) =>
    '<tr class="' + (isT(o) ? 'target' : '') + '"><td>' + day(o.date) + '</td><td>' + PERIOD[o.period] + '</td><td>' + o.from + (o.to ? '–' + o.to : '') + '</td><td class="price">' + money(o) + spark(o) + '</td><td>' +
    (o.baseline ? '<span class="mute">avant le suivi</span>' : stamp(o.releasedAt)) + '</td><td>' + (o.baseline ? '≥ ' : '') + ago(o.releasedAt || o.firstSeenAt) + '</td><td><a href="' + url(d, o) + '" target="_blank" rel="noopener">réserver</a></td></tr>')) : empty('Rien en vente au dernier scan.');

  const rel = [...tracked].sort((a, b) => b.releasedAt.localeCompare(a.releasedAt));
  document.getElementById('releases').innerHTML = rel.length ? table(['Sorti le', 'Fenêtre', 'Pour le', 'Créneau', 'Prix de départ', 'Avance', 'État'], rel.map((o) =>
    '<tr class="' + (isT(o) ? 'target' : '') + '"><td>' + stamp(o.releasedAt) + '</td><td class="mute">' + (o.notBefore ? hm(o.notBefore) + '–' + hm(o.releasedAt) : '—') + '</td><td>' + day(o.date) + '</td><td>' + PERIOD[o.period] + '</td><td class="price">' + money(o, o.prices[0].price) + '</td><td>' + lead(o).toFixed(1).replace('.', ',') + ' j</td><td>' +
    (o.closedAt ? '<span class="tag">parti</span>' : '<span class="tag on">en vente</span>') + '</td></tr>')) : empty('Aucune sortie observée depuis le début du suivi. Les créneaux déjà en vente au premier scan sont listés plus haut, sans heure de sortie.');

  const why = { sold_out: 'vendu', closed_eve: 'fermé la veille' };
  document.getElementById('gone').innerHTML = gone.length ? table(['Disparu le', 'Fenêtre', 'Date du voyage', 'Créneau', 'Dernier prix', 'Resté en vente', 'Motif'], gone.map((o) =>
    '<tr><td>' + stamp(o.closedAt) + '</td><td class="mute">' + hm(o.lastSeenAt) + '–' + hm(o.closedAt) + '</td><td>' + day(o.date) + '</td><td>' + PERIOD[o.period] + '</td><td class="price">' + money(o) + spark(o) + '</td><td>' + (o.baseline ? '≥ ' : '') + dur(new Date(o.closedAt) - new Date(o.releasedAt || o.firstSeenAt)) + '</td><td><span class="tag">' + (why[o.closedReason] || '') + '</span></td></tr>')) : empty('Aucun créneau parti depuis le début du suivi.');

  const hours = Array(24).fill(0);
  tracked.forEach((o) => hours[+f({ hour: '2-digit', hourCycle: 'h23' }).format(new Date(o.releasedAt)).slice(0, 2)]++);
  const max = Math.max(...hours);
  document.getElementById('hours').innerHTML = max ? '<div class="bars">' + hours.map((n) => '<div class="col' + (n === max ? ' peak' : '') + '" title="' + n + '">' + '<div class="b"></div>'.repeat(Math.round((n / max) * 10)) + '</div>').join('') + '</div><div class="axis">' + hours.map((_, h) => '<span>' + (h % 3 ? '' : String(h).padStart(2, '0')) + '</span>').join('') + '</div>' : empty('Le graphique se remplira avec les premières sorties observées.');

  document.getElementById('foot').innerHTML = 'Scan n° ' + String(s.scans).padStart(4, '0') + ', toutes les 15 minutes environ. Une sortie ou une disparition est située entre deux scans (colonne « fenêtre »). Le site ne publie pas le nombre de places : la vitesse est mesurée par la durée de mise en vente et les changements de prix. <a href="https://github.com/matrac73/eurostar-snap-watch">Code</a>';
}

async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById('headline').textContent = 'Données indisponibles';
    document.getElementById('sub').textContent = 'Le premier scan n\'a pas encore été publié (' + e.message + ').';
  }
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
