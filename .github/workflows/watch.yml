name: Snap watch

on:
  schedule:
    # Every 15 minutes (UTC), off the top of the hour where GitHub's scheduler is busiest.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test_mail:
        description: 'Only send sample mails to the first recipient (no scan, nothing saved)'
        type: boolean
        default: false

permissions:
  contents: write   # the scan results are committed to the gh-pages branch

concurrency:
  group: snap-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out the published data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan Snap
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ inputs.test_mail }}
        run: |
          # The Snap site turns away headless browsers, so Chrome runs with a window on a virtual display.
          if [ "$TEST_MAIL" = "true" ]; then
            node track.mjs --test-mail
          else
            xvfb-run -a node track.mjs
          fi
      - name: Publish data and dashboard
        if: inputs.test_mail != true
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"; git push -q; }
